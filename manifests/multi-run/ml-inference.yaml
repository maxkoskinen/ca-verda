##
## GPU-Agnostic ML Inference Benchmark
##
## Auto-detects GPU VRAM at runtime and selects appropriate batch sizes,
## making this manifest portable across any single-GPU Verda instance
## from V100 (16 GB) through B200 (192 GB).
##
## VRAM tiers and batch sizes:
##   ≤20 GB  (V100 16GB / MIG)    — ResNet 256,  ViT 32   (compile=default)
##   ≤52 GB  (A6000/L40S 48GB)   — ResNet 768,  ViT 192
##   ≤85 GB  (A100/H100 80GB)    — ResNet 1024, ViT 256
##   ≤100 GB (RTX PRO 6000 96GB) — ResNet 1280, ViT 320
##   >100 GB (B200 192GB)        — ResNet 2048, ViT 512
##
## Runs two models sequentially to stress different GPU subsystems:
##   1. ResNet-152  — conv-heavy, high memory bandwidth demand
##                    channels_last, pretrained IMAGENET1K_V2
##                    3000 batches, 100 warmup
##   2. ViT-L/16   — attention-heavy, high compute (tensor core) demand
##                    pretrained IMAGENET1K_V1
##                    2000 batches, 80 warmup
##
## Both phases use AMP FP16, torch.compile (reduce-overhead, or default for small VRAM),
## synthetic 224×224 input, and torch.cuda.synchronize() bracketing
## for accurate per-batch latency measurement.
##
## nodeSelector targets only the Verda zone — no instance-type pinning.
## Expected runtime: ~10-40 min depending on GPU model and batch size.
##
apiVersion: batch/v1
kind: Job
metadata:
  name: ml-inference
  namespace: test
  labels:
    app: ml-inference
    type: benchmark
    purpose: thesis-evaluation
    run-type: multi-run
spec:
  completions: 2
  parallelism: 2
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: ml-inference
        type: benchmark
        purpose: thesis-evaluation
        run-type: multi-run
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.kubernetes.io/zone: verda
        verda.com/instance-type: "2A100.44V"
      tolerations:
        - key: "node-role.kubernetes.io/cloud"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: ngc-secret
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      containers:
        - name: pytorch-inference
          image: nvcr.io/nvidia/pytorch:25.04-py3
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "5"
              nvidia.com/gpu: 1
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          command:
            - python3
            - -c
            - |
              """
              GPU-Agnostic ML Inference Benchmark
              ====================================
              Auto-detects GPU VRAM and chooses batch sizes accordingly.
              Fits any single-GPU Verda instance from V100 (16 GB) to B200 (192 GB).

              Phase 1 — ResNet-152  (conv-heavy,      3000 batches, 224x224, channels_last)
              Phase 2 — ViT-L/16   (attention-heavy,  2000 batches, 224x224)

              Uses synthetic input to isolate GPU compute from I/O.
              AMP FP16 + torch.compile(reduce-overhead) + channels_last for convolutions.
              Measures sustained throughput and latency percentiles per model.
              """
              import os, time, json, sys, gc
              import numpy as np
              import torch
              import torchvision
              from torch.amp import autocast

              # ── GPU detection and batch-size selection ───────────────
              device = torch.device("cuda" if torch.cuda.is_available() else "cpu")

              if torch.cuda.is_available():
                  gpu_props = torch.cuda.get_device_properties(0)
                  gpu_name = torch.cuda.get_device_name(0)
                  gpu_mem_total_gb = gpu_props.total_memory / (1024 ** 3)
                  sm_count = gpu_props.multi_processor_count
              else:
                  gpu_name = "N/A"
                  gpu_mem_total_gb = 0.0
                  sm_count = 0

              # Tiered batch-size selection based on VRAM
              if gpu_mem_total_gb <= 20:
                  # V100 16GB / MIG slices
                  resnet_batch = 256
                  vit_batch = 32
                  tier_label = "<=20 GB (V100 16GB class)"
                  compile_mode = "default"  # reduce-overhead (CUDA graphs) OOMs on small VRAM
              elif gpu_mem_total_gb <= 52:
                  # A6000 / L40S 48GB
                  resnet_batch = 768
                  vit_batch = 192
                  tier_label = "<=52 GB (A6000/L40S 48GB class)"
                  compile_mode = "reduce-overhead"
              elif gpu_mem_total_gb <= 85:
                  # A100 / H100 80GB
                  resnet_batch = 1024
                  vit_batch = 256
                  tier_label = "<=85 GB (A100/H100 80GB class)"
                  compile_mode = "reduce-overhead"
              elif gpu_mem_total_gb <= 100:
                  # RTX PRO 6000 96GB
                  resnet_batch = 1280
                  vit_batch = 320
                  tier_label = "<=100 GB (RTX PRO 6000 96GB class)"
                  compile_mode = "reduce-overhead"
              else:
                  # B200 192GB
                  resnet_batch = 2048
                  vit_batch = 512
                  tier_label = ">100 GB (B200 192GB class)"
                  compile_mode = "reduce-overhead"

              # ── Model configurations ────────────────────────────────
              MODEL_CONFIGS = [
                  {
                      "name": "ResNet-152",
                      "model_fn": lambda: torchvision.models.resnet152(
                          weights="IMAGENET1K_V2"
                      ),
                      "input_size": 224,
                      "batch_size": resnet_batch,
                      "num_batches": 3000,
                      "warmup": 100,
                      "channels_last": True,
                      "progress_interval": 200,
                  },
                  {
                      "name": "ViT-L/16",
                      "model_fn": lambda: torchvision.models.vit_l_16(
                          weights="IMAGENET1K_V1"
                      ),
                      "input_size": 224,
                      "batch_size": vit_batch,
                      "num_batches": 2000,
                      "warmup": 80,
                      "channels_last": False,
                      "progress_interval": 133,
                  },
              ]

              # ── Header ──────────────────────────────────────────────
              print(f"\n{'='*65}")
              print(f"GPU-Agnostic ML Inference Benchmark")
              print(f"{'='*65}")
              print(f"Device:          {device}")
              if torch.cuda.is_available():
                  print(f"GPU:             {gpu_name}")
                  print(f"GPU Memory:      {gpu_mem_total_gb:.1f} GB")
                  print(f"SM count:        {sm_count}")
                  print(f"CUDA:            {torch.version.cuda}")
              print(f"PyTorch:         {torch.__version__}")
              print(f"VRAM tier:       {tier_label}")
              print(f"Auto batch sizes: ResNet={resnet_batch}, ViT={vit_batch}")
              print(f"AMP:             enabled (FP16)")
              print(f"torch.compile:   enabled ({compile_mode})")
              print(f"Models:          {', '.join(c['name'] for c in MODEL_CONFIGS)}")
              print(f"{'='*65}\n")
              sys.stdout.flush()

              all_results = []

              for phase_idx, cfg in enumerate(MODEL_CONFIGS, 1):
                  m_name      = cfg["name"]
                  input_size  = cfg["input_size"]
                  batch_size  = cfg["batch_size"]
                  num_batches = cfg["num_batches"]
                  warmup      = cfg["warmup"]
                  prog_int    = cfg["progress_interval"]
                  total_imgs  = num_batches * batch_size

                  print(f"\n{'─'*65}")
                  print(f"Phase {phase_idx}/{len(MODEL_CONFIGS)}: {m_name}")
                  print(f"{'─'*65}")
                  print(f"  Input:         {input_size}x{input_size} x 3")
                  print(f"  Batch size:    {batch_size}")
                  print(f"  Batches:       {num_batches} (+ {warmup} warmup)")
                  print(f"  Total images:  {total_imgs:,}")
                  print(f"  channels_last: {cfg['channels_last']}")
                  sys.stdout.flush()

                  # Load model
                  print(f"  Loading model...")
                  sys.stdout.flush()
                  model = cfg["model_fn"]()
                  model = model.to(device)
                  if cfg["channels_last"]:
                      model = model.to(memory_format=torch.channels_last)
                  model.eval()

                  print(f"  Compiling model with torch.compile(mode='{compile_mode}')...")
                  sys.stdout.flush()
                  model = torch.compile(model, mode=compile_mode)

                  num_params = sum(p.numel() for p in model.parameters())
                  param_mem = sum(p.numel() * p.element_size() for p in model.parameters()) / 1e9
                  print(f"  Parameters:    {num_params / 1e6:.1f} M  ({param_mem:.2f} GB FP32)")
                  sys.stdout.flush()

                  # Create synthetic input
                  dummy_input = torch.randn(
                      batch_size, 3, input_size, input_size, device=device
                  )
                  if cfg["channels_last"]:
                      dummy_input = dummy_input.to(memory_format=torch.channels_last)

                  # Warmup (excluded from metrics)
                  print(f"  Warming up ({warmup} batches)...")
                  sys.stdout.flush()
                  with torch.no_grad():
                      with autocast("cuda"):
                          for _ in range(warmup):
                              torch.cuda.synchronize()
                              _ = model(dummy_input)
                              torch.cuda.synchronize()
                  torch.cuda.reset_peak_memory_stats()

                  # Benchmark
                  print(f"  Running benchmark ({num_batches} batches)...")
                  sys.stdout.flush()
                  latencies = []

                  with torch.no_grad():
                      with autocast("cuda"):
                          for i in range(num_batches):
                              torch.cuda.synchronize()
                              t0 = time.perf_counter()
                              _ = model(dummy_input)
                              torch.cuda.synchronize()
                              t1 = time.perf_counter()
                              latencies.append(t1 - t0)

                              if (i + 1) % prog_int == 0:
                                  running_tp = (i + 1) * batch_size / sum(latencies)
                                  gpu_peak_now = torch.cuda.max_memory_allocated(0) / 1e9
                                  print(
                                      f"    [{i+1:5d}/{num_batches}] "
                                      f"throughput: {running_tp:,.1f} img/s  "
                                      f"GPU peak: {gpu_peak_now:.1f} GB"
                                  )
                                  sys.stdout.flush()

                  latencies = np.array(latencies)
                  total_time = latencies.sum()
                  throughput = total_imgs / total_time
                  lat_ms = latencies * 1000.0

                  gpu_mem_peak = torch.cuda.max_memory_allocated(0) / 1e9

                  result = {
                      "model": m_name,
                      "batch_size": batch_size,
                      "num_batches": num_batches,
                      "warmup_batches": warmup,
                      "total_images": total_imgs,
                      "throughput_img_sec": round(throughput, 1),
                      "latency_ms": {
                          "mean": round(float(np.mean(lat_ms)), 2),
                          "std": round(float(np.std(lat_ms)), 2),
                          "p50": round(float(np.percentile(lat_ms, 50)), 2),
                          "p95": round(float(np.percentile(lat_ms, 95)), 2),
                          "p99": round(float(np.percentile(lat_ms, 99)), 2),
                          "min": round(float(lat_ms.min()), 2),
                          "max": round(float(lat_ms.max()), 2),
                      },
                      "gpu_mem_peak_gb": round(gpu_mem_peak, 2),
                  }
                  all_results.append(result)

                  print(f"\n  ── {m_name} Results ──")
                  print(f"  Batch size:        {batch_size}")
                  print(f"  Total images:      {total_imgs:,}")
                  print(f"  Throughput:        {throughput:,.1f} images/sec")
                  print(f"  Latency mean:      {np.mean(lat_ms):.2f} ms  (std: {np.std(lat_ms):.2f})")
                  print(f"  Latency p50:       {np.percentile(lat_ms, 50):.2f} ms")
                  print(f"  Latency p95:       {np.percentile(lat_ms, 95):.2f} ms")
                  print(f"  Latency p99:       {np.percentile(lat_ms, 99):.2f} ms")
                  print(f"  Latency min/max:   {lat_ms.min():.2f} / {lat_ms.max():.2f} ms")
                  print(f"  GPU Peak Memory:   {gpu_mem_peak:.2f} GB")
                  sys.stdout.flush()

                  # Free model memory before next phase
                  del model, dummy_input
                  gc.collect()
                  torch.cuda.empty_cache()

              # ── Combined JSON output ────────────────────────────────
              summary = {
                  "benchmark": "ml-inference",
                  "gpu_name": gpu_name,
                  "gpu_memory_total_gb": round(gpu_mem_total_gb, 1),
                  "phases": all_results,
              }

              print(f"\n{'='*65}")
              print(f"COMBINED BENCHMARK RESULTS")
              print(f"{'='*65}")
              for r in all_results:
                  print(
                      f"  {r['model']:20s}  "
                      f"{r['throughput_img_sec']:>10,.1f} img/s  "
                      f"{r['latency_ms']['p50']:>8.2f} ms p50  "
                      f"{r['gpu_mem_peak_gb']:>6.2f} GB peak"
                  )
              print(f"{'='*65}")
              sys.stdout.flush()

              print(f"\nJSON_RESULTS_START")
              print(json.dumps(summary, indent=2))
              print(f"JSON_RESULTS_END")
              sys.stdout.flush()
              print("\nInference benchmark complete.")
