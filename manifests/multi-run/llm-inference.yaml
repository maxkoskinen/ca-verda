##
## LLM Inference Benchmark — Ollama + Llama 3.1 8B
##
## Deploys an Ollama server with a preloaded LLM for interactive
## inference benchmarking on any single-GPU Verda instance.
##
## Model: llama3.1:8b (Q4_K_M, ~4.7 GB on disk, ~6 GB VRAM)
## Fits comfortably in 16 GB VRAM (V100-16GB / MIG slices).
##
## The model is pulled automatically on startup via an init-style
## loop in the main container. Once the "model ready" log line
## appears, the server is ready for requests.
##
## Usage (from your local terminal):
##
##   # Deploy
##   kubectl apply -f llm-inference.yaml
##
##   # Wait for the model to be pulled and loaded
##   kubectl -n test logs -f deploy/ollama
##
##   # Port-forward the Ollama API to localhost
##   kubectl -n test port-forward svc/ollama 11434:11434
##
##   # Interactive chat
##   curl http://localhost:11434/api/chat -d '{
##     "model": "llama3.1:8b",
##     "messages": [{"role": "user", "content": "Hello!"}],
##     "stream": false
##   }'
##
##   # Or use the Ollama CLI (if installed locally)
##   OLLAMA_HOST=http://localhost:11434 ollama run llama3.1:8b
##
##   # Simple generation benchmark (measure tokens/sec)
##   curl -s http://localhost:11434/api/generate -d '{
##     "model": "llama3.1:8b",
##     "prompt": "Write a detailed essay about the history of computing.",
##     "stream": false
##   }' | python3 -c "
##   import json, sys
##   r = json.load(sys.stdin)
##   prompt_ns  = r.get('prompt_eval_duration', 0)
##   gen_ns     = r.get('eval_duration', 0)
##   prompt_tok = r.get('prompt_eval_count', 0)
##   gen_tok    = r.get('eval_count', 0)
##   print(f'Prompt tokens:    {prompt_tok}')
##   print(f'Generated tokens: {gen_tok}')
##   if prompt_ns > 0:
##       print(f'Prompt eval:      {prompt_tok / (prompt_ns / 1e9):.1f} tokens/sec')
##   if gen_ns > 0:
##       print(f'Generation:       {gen_tok / (gen_ns / 1e9):.1f} tokens/sec')
##   print(f'Total duration:   {r.get(\"total_duration\", 0) / 1e9:.2f} s')
##   "
##
##   # Cleanup
##   kubectl delete -f llm-inference.yaml
##
## nodeSelector targets only the Verda zone — no instance-type pinning.
##
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: test
  labels:
    app: ollama
    type: benchmark
    purpose: thesis-evaluation
    run-type: multi-run
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        type: benchmark
        purpose: thesis-evaluation
        run-type: multi-run
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: verda
        verda.com/instance-type: "2A100.44V"
      tolerations:
        - key: "node-role.kubernetes.io/cloud"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      volumes:
        - name: ollama-data
          emptyDir:
            sizeLimit: 12Gi
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: "12Gi"
              nvidia.com/gpu: 1
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            - name: OLLAMA_MODELS
              value: /ollama-data/models
          volumeMounts:
            - name: ollama-data
              mountPath: /ollama-data
          command:
            - bash
            - -c
            - |
              set -e
              echo "Starting Ollama server..."
              ollama serve &
              SERVER_PID=$!

              echo "Waiting for server..."
              for i in $(seq 1 120); do
                if wget -qO- http://localhost:11434/api/tags > /dev/null 2>&1; then
                  echo "Server ready (${i}s)"
                  break
                fi
                sleep 1
              done

              MODEL="llama3.1:8b"
              echo "Pulling ${MODEL}..."
              ollama pull "${MODEL}"

              echo "Warming up..."
              wget -qO- --post-data '{"model":"llama3.1:8b","prompt":"Hello","stream":false}' \
                http://localhost:11434/api/generate > /dev/null 2>&1 || true

              echo "Ollama is ready! Model: ${MODEL}"
              wait $SERVER_PID
          startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: test
  labels:
    app: ollama
    type: benchmark
    purpose: thesis-evaluation
    run-type: multi-run
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
  type: ClusterIP
