apiVersion: v1
kind: Pod
metadata:
  name: nbody-gpu-benchmark
  namespace: test
spec:
  restartPolicy: OnFailure
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        # Term 1: MIG-enabled GPU instances
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: In
            values:
            - verda
          - key: nvidia.com/mig.config
            operator: In
            values:
            - "all-1g.18gb"
            - "all-1g.10gb"
            - "all-1g.23gb"
        # Term 2: Non-MIG GPU instances (by instance type)
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: In
            values:
            - verda
          - key: verda.com/instance-type
            operator: In
            values:
 #           - "1A6000.10V"
 #           - "2A6000.20V"
 #           - "4A6000.40V"
 #           - "8A6000.80V"
 #           - "1RTX6000ADA.10V"
 #           - "2RTX6000ADA.20V"
 #           - "4RTX6000ADA.40V"
 #           - "8RTX6000ADA.80V"
            - "1A100.22V"
            - "2A100.44V"
            - "4A100.88V"
            - "8A100.176V"
#            - "1A100.40S.22V"
#            - "8A100.40S.176V"
#            - "1H100.80S.30V"
#            - "2H100.80S.80V"
#            - "4H100.80S.176V"
#            - "8H100.80S.176V"
  tolerations:
    - key: "node-role.kubernetes.io/cloud"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  containers:
  - name: cuda-container
    image: nvcr.io/nvidia/k8s/cuda-sample:nbody
    args: ["nbody", "-gpu", "-benchmark"]
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "1"
        memory: "1Gi"
        nvidia.com/gpu: 1

    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: all
