apiVersion: v1
kind: Pod
metadata:
  name: nbody-gpu-benchmark
  namespace: test
spec:
  restartPolicy: OnFailure
  nodeSelector:
    topology.kubernetes.io/zone: verda
  tolerations:
    - key: "node-role.kubernetes.io/cloud"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  containers:
  - name: cuda-container
    image: nvcr.io/nvidia/k8s/cuda-sample:nbody
    args: ["nbody", "-gpu", "-benchmark"]
    resources:
      limits:
        nvidia.com/gpu: 1
    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: all
