apiVersion: v1
kind: ConfigMap
metadata:
  name: verda-provider-config
  namespace: kube-system
data:
  WG_ADDRESS: "10.200.0.1/16"
  WG_LISTEN_PORT: "51820"
  WG_EGRESS_IFACE: "enX0"
  WG_CIDRS: "10.200.0.0/24,10.42.0.0/16,10.43.0.0/16,10.164.4.0/22"
  POD_CIDR: "10.42.0.0/16"
  SVC_CIDR: "10.43.0.0/16"
  WG_NETWORK: "10.200.0.0/24"

  config.yaml: |
