          - "10.200.0.0/24"
          - "10.42.0.0/16"
          - "10.43.0.0/16"
          - "10.164.4.0/22"
    script_template: k3s
    kubernetes:
        endpoint: "control01.k3s.aalto.fi:6443"
    node_groups:
      1V100-6V-FIN-01:
        instance_type: "1V100.6V"
        image: "ubuntu-24.04-cuda-12.6-docker"
        min_size: 0
        max_size: 10
        location: "FIN-01"
        ssh_key_ids:
          - "15629643-9ac2-4893-b7db-e5a2efd700cd"
        startup_script_id: "script-uuid-here"
        hourly_price: 0.6
        contract: "SPOT"
        pricing: "FIXED_PRICE"
        labels:
          verda.com/gpu: "true"
          node.kubernetes.io/role: "cloud-worker"
          topology.kubernetes.io/zone: "verda"
        taints:
          node-role.kubernetes.io/cloud: true:NoSchedule

