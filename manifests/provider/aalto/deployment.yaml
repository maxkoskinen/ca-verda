---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verda-cloud-provider
  namespace: kube-system
  labels:
    app: verda-cloud-provider
    component: cloud-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verda-cloud-provider
  strategy:
      type: Recreate
  template:
    metadata:
      labels:
        app: verda-cloud-provider
        component: cloud-provider
    spec:
      hostNetwork: true
      dnsPolicy: Default
      serviceAccountName: verda-cloud-provider
      nodeSelector:
        kubernetes.io/hostname: control01.k3s.aalto.fi
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
      - name: provider
        image: ghcr.io/maxkoskinen/ca-verda:v0.0.4-dev-k3s
        imagePullPolicy: Always
        securityContext:
          privileged: true
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN", "SYS_ADMIN"]
        ports:
        - containerPort: 8086
          name: grpc
          protocol: TCP
        env:
        - name: VERDA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: verda-credentials
              key: client-id
        - name: VERDA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: verda-credentials
              key: client-secret
        - name: WG_ADDRESS
          value: "10.200.0.1/16"
        - name: WG_LISTEN_PORT
          value: "51820"
        - name: POD_CIDR
          value: "10.42.0.0/16"
        - name: SVC_CIDR
          value: "10.43.0.0/16"
        - name: WG_EGRESS_IFACE
          value: "enX0"

        #- name: TLS_CERT_FILE
        #  value: /etc/grpc-tls/tls.crt
        #- name: TLS_KEY_FILE
        #  value: /etc/grpc-tls/tls.key
        #- name: TLS_CA_FILE
        #  value: /etc/grpc-tls/ca.crt
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: dev-net-tun
          mountPath: /dev/net/tun
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        #- name: grpc-tls
        #  mountPath: /etc/grpc-tls
        #  readOnly: true
        args:
        - "--config=/config/config.yaml"
        - "--port=8086"
        - "--log-level=DEBUG"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: verda-provider-config
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: lib-modules
        hostPath:
          path: /lib/modules
      #- name: grpc-tls
      #  secret:
      #    secretName: verda-grpc-server-tls
      #    defaultMode: 0400
      #restartPolicy: Always
